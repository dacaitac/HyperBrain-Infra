name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          path-to-document: 'https://github.com/dacaitac/HyperBrain-Infra/blob/main/CLA.md'

          custom-notsigned-prcomment: >
            Gracias por tu contribución a **HyperBrain-Infra**. Antes de aceptar este
            PR necesitamos que firmes nuestro **Contributor License Agreement (CLA)**.
            Lee el [CLA.md](https://github.com/dacaitac/HyperBrain-Infra/blob/main/CLA.md)
            y, si estás de acuerdo, responde en este PR con el siguiente comentario:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: >
            ✅ Todas las personas que han contribuido han firmado el CLA. ¡Gracias!
            Soporte: **i7.danielcc@gmail.com**.

          allowlist: dacaitac,bot*
