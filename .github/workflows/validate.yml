name: Validate Infra

on: [push]

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config --quiet
        env:
          POSTGRES_USER: hyperbrain
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: hyperbrain
          JWT_SECRET: placeholder-jwt-secret-for-compose-config-validation-only

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check terraform directory
        id: tf-exists
        run: |
          if [ -d "terraform/sqs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.tf-exists.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (no backend)
        if: steps.tf-exists.outputs.exists == 'true'
        working-directory: terraform/sqs
        run: terraform init -backend=false

      - name: Terraform Validate
        if: steps.tf-exists.outputs.exists == 'true'
        working-directory: terraform/sqs
        run: terraform validate

  validate-lambda-notion-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (no backend)
        working-directory: lambda/notion-webhook
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: lambda/notion-webhook
        run: terraform validate

      - name: Python syntax check
        working-directory: lambda/notion-webhook
        run: python3 -m py_compile handler.py
