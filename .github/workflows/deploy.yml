name: Deploy Infra

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, daniel-ubuntu]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # The migrations step diffs HEAD~1..HEAD; a depth-1 clone has no parent commit.
          fetch-depth: 2

      # ~/hyperbrain-deploy is the persistent runtime directory on daniel-ubuntu.
      # Its .env holds real secrets and is created once, by hand, outside of CI —
      # this sync never touches it.
      - name: Sync compose + migrations to the persistent deploy directory
        run: |
          mkdir -p ~/hyperbrain-deploy
          rsync -a --delete --exclude '.env' docker-compose.yml infrastructure supabase scripts ~/hyperbrain-deploy/

      - name: Apply compose changes
        working-directory: /home/danielc/hyperbrain-deploy
        run: |
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans

      - name: Apply DDL to Compose PostgreSQL (idempotent)
        working-directory: /home/danielc/hyperbrain-deploy
        run: |
          TABLE_EXISTS=$(docker compose exec -T postgres psql -U hyperbrain -d hyperbrain -tAc \
            "SELECT to_regclass('public.outbox_events') IS NOT NULL;" 2>/dev/null || echo "f")
          if [ "${TABLE_EXISTS}" = "t" ]; then
            echo "Domain schema already present — skipping apply-schema.sh."
          else
            echo "Domain schema absent — applying DDL..."
            bash scripts/apply-schema.sh
          fi

      - name: Apply Supabase remote migrations (only if supabase/migrations/ changed)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            supabase db push --password "${{ secrets.DB_PASSWORD }}"
          else
            echo "No migration changes — skipping remote db push."
          fi

      - name: Health check critical services
        run: |
          docker compose --env-file /home/danielc/hyperbrain-deploy/.env -f /home/danielc/hyperbrain-deploy/docker-compose.yml ps postgres | grep -q healthy
