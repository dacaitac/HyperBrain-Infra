# Deploy to the k3s cluster (ADR-021 D6/F9').
#
# Replaces the Compose deploy on the self-hosted daniel-ubuntu runner: this CD
# is a GitHub-hosted runner that joins the tailnet EPHEMERALLY and applies the
# Kustomize overlay against the control plane on hyperbrain-oci — immune to
# any of our own hosts being down (the incident that motivated the ADR).
# The self-hosted runner never returns to the deploy path.
#
# Required repository/environment secrets (see k8s/README.md):
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale OAuth client (tag:ci)
#   KUBECONFIG_B64                        base64 kubeconfig against 100.110.72.116:6443
#   SOPS_AGE_KEY                          age private key matching secrets.enc.env
#
# Rollback (D6): re-run with the previous commit / previous image tag in
# k8s/overlays/prod/kustomization.yaml — never via Compose.
name: Deploy Infra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  KUBECTL_VERSION: v1.36.2 # matches the k3s server (v1.36.2+k3s1)
  SOPS_VERSION: v3.13.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fail fast, with a clear message, while the encrypted secrets file is
      # not yet in the repo (the age key never left Daniel's side — see
      # k8s/README.md "Regenerating secrets.enc.env").
      - name: Preflight — secrets.enc.env must exist
        run: |
          if [ ! -f secrets.enc.env ]; then
            echo "::error::secrets.enc.env is missing from the repo root."
            echo "::error::Daniel must regenerate it: build a plaintext .env with the"
            echo "::error::hyperbrain-secrets keys (k8s/README.md) and run:"
            echo "::error::  sops --encrypt --age <AGE_PUBLIC_KEY> .env > secrets.enc.env"
            exit 1
          fi

      - name: Migrations parity gate
        run: scripts/k8s/sync-migrations.sh --check

      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.98.8

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # Force Tailscale to establish the direct peer route to OCI before any
      # kubectl call. Ephemeral peers need NAT-traversal warmup; without this
      # the first kubectl request races against route establishment and times out.
      - name: Warm up Tailscale route to OCI
        run: |
          for i in $(seq 1 12); do
            tailscale ping --c 1 100.110.72.116 && break
            echo "ping attempt $i failed, retrying in 5s…"
            sleep 5
          done

      - name: Configure kubeconfig
        run: |
          install -m 700 -d "$RUNNER_TEMP/kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/kube/config"
          kubectl version --request-timeout=60s

      - name: Install sops
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          sops --version

      # rclone.conf travels inside the env file as RCLONE_CONF_B64 (base64 of
      # the full file) and becomes the `rclone.conf` file key of the Secret.
      - name: Sync hyperbrain-secrets from SOPS
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          sops -d secrets.enc.env > "$RUNNER_TEMP/secrets.env"
          grep '^RCLONE_CONF_B64=' "$RUNNER_TEMP/secrets.env" \
            | cut -d= -f2- | base64 -d > "$RUNNER_TEMP/rclone.conf"
          grep -v '^RCLONE_CONF_B64=' "$RUNNER_TEMP/secrets.env" > "$RUNNER_TEMP/secrets.stripped.env"
          kubectl create namespace hyperbrain \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic hyperbrain-secrets -n hyperbrain \
            --from-env-file="$RUNNER_TEMP/secrets.stripped.env" \
            --from-file=rclone.conf="$RUNNER_TEMP/rclone.conf" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$RUNNER_TEMP/secrets.env" "$RUNNER_TEMP/secrets.stripped.env" "$RUNNER_TEMP/rclone.conf"

      # Idempotent re-apply of the pinned, vendored operators (CRDs first).
      - name: Apply operators (CNPG + Tailscale)
        run: |
          kubectl apply --server-side -f k8s/operators/cnpg/cnpg-1.29.2.yaml
          kubectl apply --server-side -f k8s/operators/tailscale/tailscale-operator-1.98.8.yaml

      # db-migrate is immutable and its migrations ConfigMap name is hashed:
      # drop the finished Job so the re-apply can create the new revision.
      - name: Apply overlay
        run: |
          kubectl delete job db-migrate -n hyperbrain --ignore-not-found
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl wait --for=condition=Ready clusters.postgresql.cnpg.io/hyperbrain-db \
            -n hyperbrain --timeout=15m
          kubectl wait --for=condition=complete job/db-migrate \
            -n hyperbrain --timeout=10m
          kubectl rollout status deployment/hyperbrain-core -n hyperbrain --timeout=10m
          kubectl rollout status deployment/gotrue -n hyperbrain --timeout=5m
          kubectl rollout status deployment/postgrest -n hyperbrain --timeout=5m
          kubectl rollout status deployment/kube-state-metrics -n hyperbrain --timeout=5m

      # Resolve the core's tailnet proxy through tailscale itself (no MagicDNS
      # dependency on the runner's resolver).
      - name: Health check core via tailnet
        run: |
          CORE_IP="$(tailscale ip -4 hyperbrain-core)"
          echo "hyperbrain-core resolves to ${CORE_IP}"
          curl -sf --retry 10 --retry-delay 15 --retry-all-errors \
            "http://${CORE_IP}:8080/actuator/health"
