services:

  # ── Core data layer ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hyperbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Message queue ──────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: hyperbrain-localstack
    restart: unless-stopped
    environment:
      # lambda: dev double of the Notion webhook receiver (lambda/notion-webhook, #41)
      SERVICES: sqs,lambda
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4566:4566"
    volumes:
      # LocalStack's Lambda executor spawns runtime containers via the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqs-init:
    image: amazon/aws-cli:latest
    container_name: hyperbrain-sqs-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
    entrypoint: ["/bin/sh", "/scripts/init-queues.sh"]
    volumes:
      - ./infrastructure/localstack/init-queues.sh:/scripts/init-queues.sh:ro
    mem_limit: 64m
    restart: "no"

  # ── Supabase minimal (GoTrue + PostgREST) ──────────────────────────────────
  # ADR-006: only GoTrue and PostgREST; no Realtime/Functions/Storage/Studio
  gotrue:
    image: supabase/gotrue:v2.151.0
    container_name: hyperbrain-gotrue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=auth"
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:9999}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9999:9999"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: hyperbrain-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # ADR-025 D1: PostgREST exposes ONLY the `api` schema of read-model views. No
      # public table is reachable over HTTP; the views (security_invoker) qualify
      # their base tables as public.<table>, so no search_path change is needed.
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    ports:
      # 3000 is taken by an unrelated grafana container already running on daniel-ubuntu.
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3000"
    mem_limit: 128m
    # No healthcheck: the official image ships no shell (not even /bin/sh) and no
    # curl/wget, so there is nothing a CMD/CMD-SHELL probe can execute inside the
    # container. Verified reachable externally via `curl http://localhost:3001/`.

  # ── Optional profiles ──────────────────────────────────────────────────────
  hyperbrain-core:
    profiles: [app]
    image: ghcr.io/dacaitac/hyperbrain-core:latest
    container_name: hyperbrain-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      # Container timezone. The Prioritizer runs a @Scheduled tick (#66a); unless the
      # annotation pins a zone, it inherits the JVM default (UTC in the container).
      # Setting TZ keeps time-of-day scheduling aligned with the operator's wall clock.
      # Harmless: overridable per-environment via .env.
      TZ: ${TZ:-America/Bogota}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Dev default: LocalStack. For real AWS SQS (e.g. to receive events from SentinelAPI on the
      # Mac Mini) set these in .env: AWS_SQS_ENDPOINT_OVERRIDE=https://sqs.<region>.amazonaws.com,
      # SQS_QUEUE_SYNC_EVENTS=<full queue URL> (the full URL avoids sqs:GetQueueUrl), + real creds.
      AWS_SQS_ENDPOINT_OVERRIDE: ${AWS_SQS_ENDPOINT_OVERRIDE:-http://localstack:4566}
      SQS_QUEUE_SYNC_EVENTS: ${SQS_QUEUE_SYNC_EVENTS:-sync-events.fifo}
      SQS_QUEUE_APPLE_COMMANDS: ${SQS_QUEUE_APPLE_COMMANDS:-apple-commands.fifo}
      SQS_QUEUE_APPLE_COMMANDS_RESULTS: ${SQS_QUEUE_APPLE_COMMANDS_RESULTS:-apple-commands-results.fifo}
      # User commands iOS -> core (HU-01b #66): replan trigger + Sleep Score input.
      SQS_QUEUE_USER_COMMANDS: ${SQS_QUEUE_USER_COMMANDS:-user-commands.fifo}
      # Disable while apple-commands-results.fifo is not provisioned in the target account.
      SYNC_RESULTS_CONSUMER_ENABLED: ${SYNC_RESULTS_CONSUMER_ENABLED:-true}
      # HU-01b morning agenda dispatch (deploy-safe default OFF; enable once the SentinelAPI
      # write-back + "HyperBrain" calendar are live on the Mac Mini).
      APP_PLANNER_DELIVERY_SCHEDULING_ENABLED: ${APP_PLANNER_DELIVERY_SCHEDULING_ENABLED:-false}
      # HU-01b user-commands consumer (default OFF until user-commands.fifo + DLQ exist in AWS).
      USER_COMMANDS_CONSUMER_ENABLED: ${USER_COMMANDS_CONSUMER_ENABLED:-false}
      # Notion sync (HU-10 outbound + HU-14 inbound). Off unless NOTION_TOKEN is provisioned
      # in .env (CA-12/CA-16); data source ids default to the Tasks/Cycles collections
      # verified in issue #15. The database ids (HU-14) let the consumer match webhook
      # parents that arrive as database_id instead of data_source_id.
      NOTION_SYNC_ENABLED: ${NOTION_SYNC_ENABLED:-false}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_TASKS_DATA_SOURCE_ID: ${NOTION_TASKS_DATA_SOURCE_ID:-1bf8bc9c5d918171b7ea000b7e326082}
      NOTION_CYCLES_DATA_SOURCE_ID: ${NOTION_CYCLES_DATA_SOURCE_ID:-1bf8bc9c5d9181e78737000b45812f45}
      NOTION_TASKS_DATABASE_ID: ${NOTION_TASKS_DATABASE_ID:-1bf8bc9c5d91812b8c97e5e6450858aa}
      NOTION_CYCLES_DATABASE_ID: ${NOTION_CYCLES_DATABASE_ID:-1bf8bc9c5d9181d882cfe1f4aa38f295}
      SERVER_PORT: 8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    mem_limit: 512m
    healthcheck:
      # eclipse-temurin:*-jre-alpine has no curl; busybox wget is present instead.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inbucket:
    profiles: [email]
    image: inbucket/inbucket:3.0.4
    container_name: hyperbrain-inbucket
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:2500:2500"
      - "${BIND_ADDRESS:-127.0.0.1}:1100:1100"
    mem_limit: 64m

volumes:
  postgres_data:
    name: hyperbrain-postgres-data
