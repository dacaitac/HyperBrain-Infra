# Tailnet exposure (ADR-021 F8'): `hyperbrain-ksm` scraped by the Prometheus
# on hyperbrain-oci (outside the cluster, D7).
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: hyperbrain
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: hyperbrain-ksm
