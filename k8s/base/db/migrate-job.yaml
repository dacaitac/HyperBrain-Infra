# db-migrate — applies the versioned migrations against the CNPG cluster
# (ADR-021 D3/F4'). Runs to completion once per migration-set change; safe to
# re-run (the runner skips applied files via infra.schema_migrations).
#
# NOTE ON RE-APPLIES: the migrations ConfigMap carries a kustomize name hash,
# so a changed migration set changes this (immutable) Job spec. TTL below
# auto-removes finished Jobs after 15 min; if the CD applies sooner, it must
# `kubectl -n hyperbrain delete job db-migrate --ignore-not-found` first.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: hyperbrain
  labels:
    app: db-migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          # Same operand image as the cluster: guarantees a matching psql 16
          image: ghcr.io/dacaitac/cnpg-pgvector:16
          command: ["/bin/bash", "/runner/apply-migrations.sh"]
          env:
            - name: PGHOST
              value: hyperbrain-db-rw.hyperbrain.svc
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: hyperbrain
            # Generated by CNPG (enableSuperuserAccess: true)
            - name: SUPERUSER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-superuser
                  key: username
            - name: SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-superuser
                  key: password
            # Generated by CNPG (bootstrap.initdb owner)
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-app
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-app
                  key: password
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: runner
              mountPath: /runner
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            # Generated in k8s/base/db/migrations/ (see scripts/k8s/sync-migrations.sh)
            name: hyperbrain-db-migrations
        - name: runner
          configMap:
            name: db-migrate-runner
