# PERMANENT off-site backup (promoted from interim by Infra#28, 2026-08-07):
# daily pg_dump -> age encrypt -> rclone off-site, targeting hyperbrain-db-rw
# directly. Supersedes the systemd/NAS chain on daniel-ubuntu
# (hyperbrain-backup.timer), which the #28 audit found broken (BACKUP_PG_HOST
# still pointed at the retired docker-compose Postgres) and is being disabled,
# not repointed — see docs/runbook-daniel-ubuntu-join.md §3.
#
# Secrets (see k8s/README.md): BACKUP_AGE_RECIPIENT, BACKUP_RCLONE_REMOTE,
# BACKUP_OFFSITE_PATH and the `rclone.conf` file key, all in hyperbrain-secrets.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-offsite
  namespace: hyperbrain
  labels:
    app: pg-dump-offsite
spec:
  schedule: "0 3 * * *"
  timeZone: America/Bogota
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: pg-dump-offsite
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # alpine + apk: postgresql16-client (pg_dump), age, rclone.
              # Network install per run is the accepted trade-off of the
              # interim (no custom backup image to maintain and then retire).
              image: alpine:3.20
              command:
                - /bin/sh
                - -ec
                - |
                  # Preflight: skip gracefully if BACKUP_AGE_RECIPIENT is not yet
                  # configured (secrets.enc.env not regenerated — see k8s/README.md).
                  if [ -z "${BACKUP_AGE_RECIPIENT}" ]; then
                    echo "[pg-dump-offsite] SKIP: BACKUP_AGE_RECIPIENT is empty — set it in hyperbrain-secrets and rerun."
                    exit 0
                  fi
                  apk add --no-cache postgresql16-client age rclone
                  today="$(date +%Y-%m-%d)"
                  dump="/tmp/hyperbrain_${today}.dump"
                  echo "[pg-dump-offsite] dumping ${PGDATABASE} @ ${PGHOST}"
                  pg_dump --format=custom --compress=9 --file="${dump}" "${PGDATABASE}"
                  echo "[pg-dump-offsite] encrypting for ${BACKUP_AGE_RECIPIENT}"
                  age -r "${BACKUP_AGE_RECIPIENT}" -o "${dump}.age" "${dump}"
                  echo "[pg-dump-offsite] uploading to ${BACKUP_RCLONE_REMOTE}:${BACKUP_OFFSITE_PATH}/"
                  rclone --config /etc/rclone/rclone.conf copy \
                    "${dump}.age" "${BACKUP_RCLONE_REMOTE}:${BACKUP_OFFSITE_PATH}/"
                  echo "[pg-dump-offsite] done: hyperbrain_${today}.dump.age"
              env:
                - name: PGHOST
                  value: hyperbrain-db-rw.hyperbrain.svc
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: hyperbrain
                # Superuser: dumps every schema regardless of ownership
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: hyperbrain-db-superuser
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hyperbrain-db-superuser
                      key: password
                - name: BACKUP_AGE_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: hyperbrain-secrets
                      key: BACKUP_AGE_RECIPIENT
                - name: BACKUP_RCLONE_REMOTE
                  valueFrom:
                    secretKeyRef:
                      name: hyperbrain-secrets
                      key: BACKUP_RCLONE_REMOTE
                - name: BACKUP_OFFSITE_PATH
                  valueFrom:
                    secretKeyRef:
                      name: hyperbrain-secrets
                      key: BACKUP_OFFSITE_PATH
              volumeMounts:
                - name: rclone-conf
                  mountPath: /etc/rclone
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: rclone-conf
              secret:
                secretName: hyperbrain-secrets
                items:
                  - key: rclone.conf
                    path: rclone.conf
