# hyperbrain-core — Spring Boot backend (ADR-021 F6').
# Derived from docker-compose.yml `hyperbrain-core` service: same image, same
# env vars, AWS SQS real (prod), datasource moved to the CNPG rw Service.
# Sensitive values come from Secret `hyperbrain-secrets` (created out-of-band
# by the CD/hub via SOPS — expected keys documented in k8s/README.md) and from
# the CNPG-generated app credentials Secret `hyperbrain-db-app`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperbrain-core
  namespace: hyperbrain
  labels:
    app: hyperbrain-core
spec:
  replicas: 1
  # Recreate: never two cores at once — the Prioritizer tick and the outbox
  # worker are designed for a single instance (MVP single-user).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hyperbrain-core
  template:
    metadata:
      labels:
        app: hyperbrain-core
    spec:
      containers:
        - name: core
          # Tag pinned per-deploy in k8s/overlays/prod (images: newTag → SHA by CD)
          image: ghcr.io/dacaitac/hyperbrain-core:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / SQS_QUEUE_* full URLs /
            # NOTION_TOKEN — see k8s/README.md
            - secretRef:
                name: hyperbrain-secrets
          env:
            # Keeps the Prioritizer @Scheduled tick (#66a) on the operator's wall clock
            - name: TZ
              value: America/Bogota
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://hyperbrain-db-rw.hyperbrain.svc:5432/hyperbrain
            # CNPG bootstrap owner credentials, generated by the operator
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperbrain-db-app
                  key: password
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # Real AWS SQS in the cluster (LocalStack is dev-only, ADR-001)
            - name: AWS_SQS_ENDPOINT_OVERRIDE
              value: https://sqs.us-east-1.amazonaws.com
            - name: SYNC_RESULTS_CONSUMER_ENABLED
              value: "true"
            - name: USER_COMMANDS_CONSUMER_ENABLED
              value: "true"
            - name: APP_PLANNER_DELIVERY_SCHEDULING_ENABLED
              value: "true"
            # H0 adherence roll-up @Scheduled 03:30 America/Bogota over the prior day
            - name: APP_TELEMETRY_ROLLUP_SCHEDULING_ENABLED
              value: "true"
            # HU-01c H3: LLM propose-then-validate tier, live. All three settings are
            # required together — the flag alone activates the tier, SPRING_AI_MODEL_CHAT
            # activates the provider ChatModel (default "none"), and the API key arrives
            # via the hyperbrain-secrets envFrom. If the provider is absent/misconfigured
            # the tier degrades to the humanized floor (no crash — see 4f6fbdb).
            - name: APP_COGNITIVE_LLM_PROPOSE_ENABLED
              value: "true"
            - name: SPRING_AI_MODEL_CHAT
              value: anthropic
            # Enabled: greenfield DB creates new Notion pages for items without external_id;
            # items migrated from compose with stale external_ids will emit 404s (logged, non-fatal).
            - name: NOTION_SYNC_ENABLED
              value: "true"
            - name: NOTION_TASKS_DATA_SOURCE_ID
              value: 1bf8bc9c5d918171b7ea000b7e326082
            - name: NOTION_CYCLES_DATA_SOURCE_ID
              value: 1bf8bc9c5d9181e78737000b45812f45
            - name: NOTION_TASKS_DATABASE_ID
              value: 1bf8bc9c5d91812b8c97e5e6450858aa
            - name: NOTION_CYCLES_DATABASE_ID
              value: 1bf8bc9c5d9181d882cfe1f4aa38f295
            # Time Blocks mirror (ADR-038, #24): agenda blocks projected to the
            # Notion "Time Blocks" DB (created 2026-08-05).
            - name: NOTION_TIMEBLOCKS_DATA_SOURCE_ID
              value: af6834d4-9fe2-42d5-a04d-cf4b5f146b5c
            - name: NOTION_TIMEBLOCKS_DATABASE_ID
              value: 0b48d06e-6773-44c0-a615-a6502bddea54
            # Kill-switch flipped ON 2026-08-05: inbound ITs green (committee
            # condition met) and core deploy e1d1951 live with the env wired.
            # Pure-outbound E2E was not runnable (prod only had FOCUS blocks,
            # excluded from the mirror); the hub verifies the full chain
            # bidirectionally via inbound (USER block created from Notion).
            - name: NOTION_TIMEBLOCKS_INBOUND_ENABLED
              value: "true"
            - name: NOTION_TIMEBLOCKS_RETENTION_DAYS
              value: "30"
            - name: SERVER_PORT
              value: "8080"
            # Size the heap from the container limit (768Mi * 0.75)
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          # Same endpoint the Compose healthcheck used (wget /actuator/health)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 18 # up to 3 min for JVM start on small nodes
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
