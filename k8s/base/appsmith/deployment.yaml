# Appsmith — PREPARED, NOT DEPLOYED (ADR-021 F6': arrives with Sprint 3 #45).
# Deliberately excluded from k8s/base/kustomization.yaml; when #45 lands, add
# `appsmith/deployment.yaml`, `appsmith/service.yaml` and `appsmith/pvc.yaml`
# to the base resources (the ladder-affinity component will then patch it too).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appsmith
  namespace: hyperbrain
  labels:
    app: appsmith
spec:
  replicas: 1
  # Recreate: appsmith-stacks is RWO local-path storage
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: appsmith
  template:
    metadata:
      labels:
        app: appsmith
    spec:
      containers:
        - name: appsmith
          image: appsmith/appsmith-ce:latest
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: stacks
              mountPath: /appsmith-stacks
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            failureThreshold: 40 # appsmith cold start is slow (embedded mongo+redis)
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: stacks
          persistentVolumeClaim:
            claimName: appsmith-stacks
