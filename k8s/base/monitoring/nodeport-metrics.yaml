# NodePort exposure for Prometheus (ADR-021 F8') — interim until Tailscale Kubernetes
# Operator is installed. These services give the external Prometheus on hyperbrain-oci
# direct access to cluster metrics via tailnet node IPs + fixed NodePorts.
# Ports: 32080 = kube-state-metrics, 32187 = CNPG primary, 32188 = CNPG replica.
# Once the Tailscale operator is installed and `tailscale.com/expose` annotations take
# effect, these can be removed in favour of the MagicDNS hostnames in prometheus.yml.
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-np
  namespace: hyperbrain
  labels:
    app: kube-state-metrics
    hyperbrain.dev/purpose: nodeport-metrics
spec:
  type: NodePort
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      nodePort: 32080
---
# CNPG primary exporter — selects whichever pod is currently primary.
# The selector follows CNPG-managed labels; the operator updates them on switchover.
apiVersion: v1
kind: Service
metadata:
  name: hyperbrain-db-metrics-np
  namespace: hyperbrain
  labels:
    hyperbrain.dev/purpose: nodeport-metrics
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: hyperbrain-db
    cnpg.io/instanceRole: primary
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
      nodePort: 32187
---
# CNPG replica exporter — targets standby(s). May have no endpoints while a
# standby is rebuilding; Prometheus shows the target down — that is expected signal.
apiVersion: v1
kind: Service
metadata:
  name: hyperbrain-db-ro-metrics-np
  namespace: hyperbrain
  labels:
    hyperbrain.dev/purpose: nodeport-metrics
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: hyperbrain-db
    cnpg.io/instanceRole: replica
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
      nodePort: 32188
