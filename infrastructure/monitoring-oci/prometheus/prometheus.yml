global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    datacenter: oci-ashburn

scrape_configs:

  # ── node-exporter — all hosts in one job so community dashboards work ─────────
  # Template variable $node auto-populates from instance label.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: hyperbrain-oci
      - targets: ['100.83.47.113:9100']
        labels:
          instance: daniel-ubuntu
      - targets: ['100.74.180.105:9100']  # pending: mac-metrics LaunchAgent (HU-13 #18)
        labels:
          instance: mac-mini
      - targets: ['100.81.242.46:9100']
        labels:
          instance: mac-mini-vm

  # ═══ k3s cluster (ADR-021 F8') — scraped from OUTSIDE the cluster (D7) ═══════
  # Tailnet hostnames (hyperbrain-ksm / hyperbrain-db*) are Tailscale-operator
  # proxies; the prometheus container resolves them through MagicDNS
  # (dns: 100.100.100.100 in the compose service).

  # ── kube-state-metrics — cluster object state (nodes, deployments, cronjobs) ─
  # NodePort 32080 (k8s/base/monitoring/nodeport-metrics.yaml) binds on all nodes;
  # daniel-ubuntu used here but any tailnet node IP works. Switch to hyperbrain-ksm:8080
  # (MagicDNS) once the Tailscale Kubernetes Operator is installed.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ['100.83.47.113:32080']
        labels:
          cluster: hyperbrain

  # ── kubelet + cAdvisor — per-node/container metrics via tailnet IPs ──────────
  # k3s kubelets require a bearer token (SA prometheus-scraper, see
  # k8s/base/monitoring/prometheus-scraper-rbac.yaml). Token file extraction is
  # documented in k8s/README.md; scrapes fail (target down) until it exists.
  - job_name: kubelet
    scheme: https
    tls_config:
      insecure_skip_verify: true # kubelet serves a self-signed cert per node
    authorization:
      credentials_file: /etc/prometheus/k8s-scraper.token
    static_configs:
      # hyperbrain-oci-host resolves to the Docker bridge gateway (host-gateway in
      # docker-compose.yml): kubelet listens on *:10250 so this reaches it locally.
      - targets: ['hyperbrain-oci-host:10250']
        labels:
          instance: hyperbrain-oci
      - targets: ['100.83.47.113:10250']
        labels:
          instance: daniel-ubuntu
      - targets: ['100.81.242.46:10250']
        labels:
          instance: mac-mini-vm

  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /etc/prometheus/k8s-scraper.token
    static_configs:
      - targets: ['hyperbrain-oci-host:10250']
        labels:
          instance: hyperbrain-oci
      - targets: ['100.83.47.113:10250']
        labels:
          instance: daniel-ubuntu
      - targets: ['100.81.242.46:10250']
        labels:
          instance: mac-mini-vm

  # ── CloudNativePG — exporter :9187 via NodePort services ───────────────────
  # NodePorts 32187 (primary) and 32188 (replica) follow CNPG instanceRole label
  # so they always route to the correct pod, even after switchover.
  # Switch to hyperbrain-db:9187 / hyperbrain-db-ro:9187 (MagicDNS) once
  # the Tailscale Kubernetes Operator is installed.
  - job_name: cnpg
    static_configs:
      - targets: ['100.83.47.113:32187']
        labels:
          role: primary
      - targets: ['100.83.47.113:32188']
        labels:
          role: replica

  # ── cadvisor — container metrics (daniel-ubuntu, port 9080 avoids core conflict)
  - job_name: cadvisor
    static_configs:
      - targets: ['100.83.47.113:9080']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu

  # ── scaphandre — energy consumption (daniel-ubuntu) ──────────────────────────
  - job_name: scaphandre
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['100.83.47.113:8081']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu

  # ── nvidia-gpu-exporter — GPU metrics (daniel-ubuntu, GTX 1050 Ti) ────────────
  - job_name: nvidia-gpu
    static_configs:
      - targets: ['100.83.47.113:9835']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu
