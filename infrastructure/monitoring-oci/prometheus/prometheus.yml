global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    datacenter: oci-ashburn

scrape_configs:

  # ── OCI VM ────────────────────────────────────────────────────────────────────
  - job_name: node-exporter-oci
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: hyperbrain-oci

  # ── daniel-ubuntu (via Tailscale 100.83.47.113) ───────────────────────────────
  - job_name: node-exporter-ubuntu
    static_configs:
      - targets: ['100.83.47.113:9100']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu

  - job_name: cadvisor
    static_configs:
      - targets: ['100.83.47.113:8080']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu

  - job_name: scaphandre
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['100.83.47.113:8081']
    relabel_configs:
      - target_label: instance
        replacement: daniel-ubuntu

  # ── mac-mini (via Tailscale 100.74.180.105) ───────────────────────────────────
  # Requires: mac-metrics LaunchAgent installed (HU-13 #18)
  - job_name: node-exporter-mac
    static_configs:
      - targets: ['100.74.180.105:9100']
    relabel_configs:
      - target_label: instance
        replacement: mac-mini
