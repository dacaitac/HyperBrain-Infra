[server]
http_port = 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
# admin_password is set via GF_SECURITY_ADMIN_PASSWORD environment variable

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/daniel-ubuntu.json

[unified_alerting]
enabled = true

[log]
mode = console
level = warn
