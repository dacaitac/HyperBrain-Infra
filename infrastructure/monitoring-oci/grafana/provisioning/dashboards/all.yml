apiVersion: 1

providers:
  - name: hyperbrain
    orgId: 1
    folder: HyperBrain
    folderUid: hyperbrain
    type: file
    # Files under options.path are the single source of truth (git). Removing a
    # dashboard file must purge it from Grafana, so deletion stays enabled.
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
