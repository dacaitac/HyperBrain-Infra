# Grafana alert rule: fires if no successful HyperBrain backup in the last 26 hours.
#
# Prerequisites:
#   1. node_exporter running on daniel-ubuntu with --collector.textfile.directory=
#      /var/lib/node_exporter/textfile_collector
#   2. hyperbrain-backup.sh writes a .prom file to that directory after each run.
#   3. Prometheus scraping node_exporter (datasource uid "prometheus" in Grafana).
#
# Deploy: copy this file to the Grafana provisioning path and reload Grafana.
#   sudo cp infrastructure/grafana/provisioning/alerting/backup-stale.yml \
#             /etc/grafana/provisioning/alerting/
#   sudo systemctl reload grafana-server
#
# The datasource UID "prometheus" must match the actual uid in your Grafana instance.
# To find it: Grafana → Connections → Data Sources → Prometheus → copy uid from URL.

apiVersion: 1

groups:
  - orgId: 1
    name: HyperBrain Backup
    folder: HyperBrain
    interval: 5m
    rules:
      - uid: hb-backup-stale-001
        title: "HyperBrain backup stale (>26h)"
        condition: threshold
        data:
          - refId: age_seconds
            relativeTimeRange:
              from: 100000
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: time() - hyperbrain_backup_last_success_timestamp
              instant: true
              refId: age_seconds
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [93600]   # 26 h = 26 × 3600 s
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [age_seconds]
                  reducer:
                    type: last
                  type: query
              expression: age_seconds
              refId: threshold
              type: threshold
        noDataState: Alerting    # treat missing metric as a stale backup
        execErrState: Error
        for: 5m
        annotations:
          summary: "No successful HyperBrain backup in the last 26 hours"
          description: >
            Seconds since last backup: {{ $values.age_seconds.Value | humanizeDuration }}.
            Check the service log: journalctl -u hyperbrain-backup.service -n 50
          runbook_url: "https://github.com/dacaitac/HyperBrain-Infra/blob/main/docs/backup-restore.md"
        labels:
          severity: critical
          component: backup
        isPaused: false
